# Prettier format gate (see docs/operations/ops/REPO_ARTIFACTS_POLICY.md)
#
# Public OSS on GitHub: authoritative CI is GitHub Actions (.github/workflows/).
# This file is for GitLab-only pipelines; omit it from a GitHub-only export if you
# want a single CI story, or keep it for a private GitLab mirror.
#
# Ignores for `.cursor/`, other AI tool dirs, IDE dirs, and `.env` align with root
# `.gitignore` and `.prettierignore`; `scripts/check-oss-artifacts.mjs` fails if any
# of those paths are still tracked in git.
stages:
  - quality

.prettier_paths: &prettier_paths
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.js'
  - '**/*.mjs'
  - '**/*.cjs'
  - '**/*.vue'
  - '**/*.json'
  - '**/*.md'
  - '**/*.yml'
  - '**/*.yaml'
  - '**/*.scss'
  - '**/*.css'
  - 'package.json'
  - '.prettierrc'
  - '.prettierignore'
  - '.gitattributes'
  - '.gitignore'
  - '.gitlab-ci.yml'

prettier:
  stage: quality
  image: node:22.13-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes: *prettier_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *prettier_paths
  script:
    - node scripts/check-oss-artifacts.mjs
    - npm ci
    - npm run format:check
