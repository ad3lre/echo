# GitLab CI mirror (internal remote; see docs/operations/github-release-mirror.md).
#
# Public OSS on GitHub: authoritative CI is GitHub Actions (.github/workflows/).
# GitLab runs Prettier on doc/format paths and a ship gate (`ci:precheck` parity) on
# application code paths so merges do not rely solely on local pre-push hooks.
#
# Ignores for `.cursor/`, other AI tool dirs, IDE dirs, and `.env` align with root
# `.gitignore` and `.prettierignore`; `server/ops/scripts/check-oss-artifacts.mjs` fails if any
# of those paths are still tracked in git.
stages:
  - quality
  - test

.prettier_paths: &prettier_paths
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.js'
  - '**/*.mjs'
  - '**/*.cjs'
  - '**/*.vue'
  - '**/*.json'
  - '**/*.md'
  - '**/*.yml'
  - '**/*.yaml'
  - '**/*.scss'
  - '**/*.css'
  - 'package.json'
  - '.prettierrc'
  - '.prettierignore'
  - '.gitattributes'
  - '.gitignore'
  - '.gitlab-ci.yml'

.ci_paths: &ci_paths
  - 'server/backend/**'
  - 'clients/web/**'
  - 'clients/apple/**'
  - 'contracts/**'
  - 'server/ops/scripts/**'
  - 'package.json'
  - 'bun.lock'
  - '.gitlab-ci.yml'

.bun_setup: &bun_setup
  before_script:
    # bookworm-slim has no git; check-oss-artifacts needs `git ls-files`
    - apt-get update -qq && apt-get install -y -qq git curl unzip ca-certificates >/dev/null
    - export BUN_VERSION="$(tr -d ' \t\r\n' < .bun-version)"
    - curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"
    - bun --version

prettier:
  stage: quality
  image: debian:bookworm-slim
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes: *prettier_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *prettier_paths
  <<: *bun_setup
  script:
    - bun server/ops/scripts/check-oss-artifacts.mjs
    - bun install --frozen-lockfile
    - bun run format:check

ship-gate:
  stage: test
  image: debian:bookworm-slim
  variables:
    # vue-tsc + vite on the web workspace OOMs at the default ~2GB heap on shared runners
    NODE_OPTIONS: '--max-old-space-size=6144'
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes: *ci_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ci_paths
  <<: *bun_setup
  script:
    - bun install --frozen-lockfile
    - bun run ci:precheck
    - bun run charter:new-code:test
