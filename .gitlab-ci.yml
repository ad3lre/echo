# GitLab CI mirror (internal remote; see docs/operations/github-release-mirror.md).
#
# Public OSS on GitHub: authoritative CI is GitHub Actions (.github/workflows/).
# GitLab runs Prettier on doc/format paths and a ship gate (`ci:precheck` parity) on
# application code paths so merges do not rely solely on local pre-push hooks.
#
# Ignores for `.cursor/`, other AI tool dirs, IDE dirs, and `.env` align with root
# `.gitignore` and `.prettierignore`; `server/ops/scripts/check-oss-artifacts.mjs` fails if any
# of those paths are still tracked in git.
stages:
  - quality
  - test

.prettier_paths: &prettier_paths
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.js'
  - '**/*.mjs'
  - '**/*.cjs'
  - '**/*.vue'
  - '**/*.json'
  - '**/*.md'
  - '**/*.yml'
  - '**/*.yaml'
  - '**/*.scss'
  - '**/*.css'
  - 'package.json'
  - '.prettierrc'
  - '.prettierignore'
  - '.gitattributes'
  - '.gitignore'
  - '.gitlab-ci.yml'

.ci_paths: &ci_paths
  - 'server/backend/**'
  - 'clients/web/**'
  - 'clients/apple/**'
  - 'contracts/**'
  - 'server/ops/scripts/**'
  - 'package.json'
  - 'bun.lock'
  - '.gitlab-ci.yml'

# Bun comes from the pinned official image (no curl|bash installer). Keep the image tag
# in sync with `.bun-version`; before_script fails the job if they drift.
.bun_image: &bun_image oven/bun:1.4.2-debian

.bun_setup: &bun_setup
  before_script:
    # check-oss-artifacts needs `git ls-files`; the bun image has no git
    - apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
    - export BUN_VERSION="$(tr -d ' \t\r\n' < .bun-version)"
    - 'test "$(bun --version)" = "$BUN_VERSION" || { echo "bun image $(bun --version) != .bun-version $BUN_VERSION - update the image tag in .gitlab-ci.yml" >&2; exit 1; }'

# node_modules cache: only default-branch pipelines may push; MR pipelines are pull-only so an
# MR job cannot poison the cache that default-branch jobs restore.
.node_modules_cache: &node_modules_cache
  key:
    files:
      - bun.lock
  paths:
    - node_modules/
  policy: $CACHE_POLICY

prettier:
  stage: quality
  image: *bun_image
  cache: *node_modules_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes: *prettier_paths
      variables:
        CACHE_POLICY: pull
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *prettier_paths
      variables:
        CACHE_POLICY: pull-push
  <<: *bun_setup
  script:
    - bun server/ops/scripts/check-oss-artifacts.mjs
    - bun install --frozen-lockfile
    - bun run format:check

ship-gate:
  stage: test
  image: *bun_image
  variables:
    # vue-tsc + vite on the web workspace OOMs at the default ~2GB heap on shared runners
    NODE_OPTIONS: '--max-old-space-size=6144'
  cache: *node_modules_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes: *ci_paths
      variables:
        CACHE_POLICY: pull
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ci_paths
      variables:
        CACHE_POLICY: pull-push
  <<: *bun_setup
  script:
    - bun install --frozen-lockfile
    - bun run ci:precheck
    - bun run charter:new-code:test

# Security gates (run on every MR and default-branch pipeline; not path-filtered).
security:
  stage: quality
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - gitleaks git --config server/ops/gitleaks.toml --redact

security-dep-audit:
  stage: quality
  image: *bun_image
  variables:
    CI: 'true'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - bun run check:dep-audit
