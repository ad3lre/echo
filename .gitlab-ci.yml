# GitLab CI mirror (see docs/operations/ops/REPO_ARTIFACTS_POLICY.md).
#
# Public OSS on GitHub: authoritative CI is GitHub Actions (.github/workflows/).
# GitLab runs Prettier on doc/format paths and a ship gate (`ci:precheck` parity) on
# application code paths so merges do not rely solely on local pre-push hooks.
#
# Ignores for `.cursor/`, other AI tool dirs, IDE dirs, and `.env` align with root
# `.gitignore` and `.prettierignore`; `scripts/check-oss-artifacts.mjs` fails if any
# of those paths are still tracked in git.
stages:
  - quality
  - test

.prettier_paths: &prettier_paths
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.js'
  - '**/*.mjs'
  - '**/*.cjs'
  - '**/*.vue'
  - '**/*.json'
  - '**/*.md'
  - '**/*.yml'
  - '**/*.yaml'
  - '**/*.scss'
  - '**/*.css'
  - 'package.json'
  - '.prettierrc'
  - '.prettierignore'
  - '.gitattributes'
  - '.gitignore'
  - '.gitlab-ci.yml'

.ci_paths: &ci_paths
  - 'backend/**'
  - 'frontend/**'
  - 'shared/**'
  - 'scripts/**'
  - 'package.json'
  - 'package-lock.json'
  - '.gitlab-ci.yml'

prettier:
  stage: quality
  image: node:22.13-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes: *prettier_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *prettier_paths
  script:
    - node scripts/check-oss-artifacts.mjs
    - npm ci
    - npm run format:check

ship-gate:
  stage: test
  image: node:22.13-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes: *ci_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ci_paths
  script:
    - npm ci
    - npm run ci:precheck
    - npm run charter:new-code:test
