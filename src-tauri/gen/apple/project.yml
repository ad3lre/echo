name: echo-desktop
options:
  bundleIdPrefix: com.echo.tauri.ios.dev
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Echo
      PRODUCT_BUNDLE_IDENTIFIER: com.echo.tauri.ios.dev
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  echo-desktop_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: echo-desktop_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: echo-desktop_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        # `metal` capability — available on all supported devices and Apple Silicon simulators.
        UIRequiredDeviceCapabilities: [metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: '1.0.0'
    entitlements:
      path: echo-desktop_iOS/echo-desktop_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        # arm64-only: Tauri's xcode-script only emits the Externals lib for the
        # Rust target(s) passed via `-t`, so an x86_64 simulator slice can never
        # link (`ld: library 'app' not found`). Intel Mac devs already used the
        # sim-release-build script which calls xcodebuild with ARCHS=arm64 directly.
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        ONLY_ACTIVE_ARCH: true
        SWIFT_VERSION: '5.0'
        DEFINES_MODULE: true
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: AuthenticationServices.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          # Merge hand-managed entitlements (associated-domains for passkeys / universal links)
          # into the Tauri-generated file.  Tauri's init/build may strip keys it doesn't manage;
          # this re-injects them before xcodebuild reads the entitlements for code-signing.
          TEMPLATE="${SRCROOT}/../../Entitlements.ios.plist"
          TARGET="${SRCROOT}/echo-desktop_iOS/echo-desktop_iOS.entitlements"
          if [ -f "$TEMPLATE" ] && [ -f "$TARGET" ]; then
            node "${SRCROOT}/../../../scripts/sync-tauri-ios-entitlements.mjs" 2>&1 || true
          fi
        name: Sync iOS Entitlements
        basedOnDependencyAnalysis: false
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
