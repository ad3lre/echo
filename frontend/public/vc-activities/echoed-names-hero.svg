    <rect x="58" y="0" width="52" height="36" rx="6" fill="url(#en-cell-n)"/>
    <rect x="116" y="0" width="52" height="36" rx="6" fill="url(#en-cell-b)"/>
    <rect x="174" y="0" width="52" height="36" rx="6" fill="url(#en-cell-n)"/>
    <rect x="232" y="0" width="52" height="36" rx="6" fill="url(#en-cell-a)"/>
    <rect x="0" y="42" width="52" height="36" rx="6" fill="url(#en-cell-b)"/>
