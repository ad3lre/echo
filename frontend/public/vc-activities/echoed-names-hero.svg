<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="en-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1224"/>
      <stop offset="45%" stop-color="#14102a"/>
      <stop offset="100%" stop-color="#0a1818"/>
    </linearGradient>
    <linearGradient id="en-cell-a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="en-cell-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c1f2a"/>
      <stop offset="100%" stop-color="#1a0a0e"/>
    </linearGradient>
    <linearGradient id="en-cell-n" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272f"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <radialGradient id="en-glow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="en-soft" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="200" fill="url(#en-bg)"/>
  <rect width="480" height="200" fill="url(#en-glow)"/>
  <g transform="translate(38 36)" filter="url(#en-soft)">
