    <rect x="174" y="84" width="52" height="36" rx="6" fill="url(#en-cell-n)"/>
    <rect x="232" y="84" width="52" height="36" rx="6" fill="#0a0a12" stroke="#f472b622"/>
  </g>
  <text x="318" y="118" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.02em">Echoed Names</text>
