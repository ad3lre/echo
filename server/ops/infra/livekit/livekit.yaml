# DEV ONLY — the key/secret and TURN credential below are public placeholders.
# Production / any shared host MUST set ECHO_LIVEKIT_YAML to a gitignored file with real values
# (e.g. server/ops/infra/livekit/livekit.local.yaml; see livekit.production.example.yaml). Its
# keys: block must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET, and rtc.turn_servers credential
# must match ECHO_TURN_CREDENTIAL used by docker-compose coturn. The backend refuses to boot in
# production with the dev key/secret.
#
# LiveKit SFU — local Docker Compose dev (single node). YAML values are literal (no ${VAR}).
# LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env must match the `keys` block (see .env.example).
# Production: use server/ops/infra/livekit/livekit.production.example.yaml and docs/operations/livekit-production.md.
#
# Webhook reaches the Echo API on the host from the LiveKit container via host.docker.internal
# (docker-compose.yml adds extra_hosts on Linux; Docker Desktop provides the name by default).
#
# LAN / other devices on your network: `bun run lan:sync` writes server/ops/infra/livekit/livekit.runtime.yaml (gitignored).

port: 7880

rtc:
  port_range_start: 57000
  port_range_end: 57100
  tcp_port: 7881
  turn_servers:
    - host: coturn
      port: 3478
      protocol: udp
      username: echo
      credential: echo_turn_dev_secret
  use_external_ip: true
  node_ip: 82.165.150.201
  enable_loopback_candidate: false
  congestion_control:
    enabled: true

room:
  # Close ghost rooms faster between webhook/reconcile cycles (seconds).
  empty_timeout: 300
  departure_timeout: 30
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/vp9
    - mime: video/h264
    - mime: video/av1

keys:
  devkey: devsecretdevsecretdevsecret1234

webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/api/v1/hooks/livekit

logging:
  level: info
