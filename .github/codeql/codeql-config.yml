name: Echo CodeQL config

# Teach CodeQL that link-unfurl URL validators are SSRF barriers.
packs:
  - echo/link-unfurl-ssrf-models

# Dev/operator scripts and tests are not production attack surface.
paths-ignore:
  - '**/tests/**'
  - '**/*.test.ts'
  - '**/*.runtime.test.ts'
  - 'scripts/seed-dev-echo.mjs'
  - 'scripts/vps-logs.mjs'
  - 'bot/**'
