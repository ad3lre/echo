name: Echo CodeQL config

# MLS routes register per-handler `config.rateLimit` (MLS_WRITE_RATE) plus global
# @fastify/rate-limit on the Echo API scope — CodeQL does not model the plugin.
query-filters:
  - exclude:
      id: js/missing-rate-limiting
      problem.path: server/backend/src/api/routes/echo/echoMls.ts
  # Plugin + per-route config.rateLimit — CodeQL does not model @fastify/rate-limit.
  - exclude:
      id: js/missing-rate-limiting
      problem.path: server/backend/src/api/routes/appleOAuth.ts
  # Local blob: URLs from createObjectURL only; CodeQL still flags video.src assignment.
  - exclude:
      id: js/xss-through-dom
      problem.path: clients/web/src/features/layout/display/captureVideoFrame.ts
  # Local blob: URLs from createObjectURL only; the detached video element is used for
  # metadata/frame decoding and cannot interpret the blob as document markup.
  - exclude:
      id: js/xss-through-dom
      problem.path: clients/web/src/features/chat/uploadFingerprint.ts
  # ssrfSafeFetch is the single network sink for unfurl requests. It rejects
  # non-HTTPS/credentialed/private targets, resolves every hostname, and uses
  # safeFetchAgent to pin the checked public address at connection time. CodeQL
  # cannot follow that asynchronous DNS + custom dispatcher proof at this sink.
  - exclude:
      id: js/request-forgery
      problem.path: server/backend/src/services/linkUnfurl/linkUnfurlFetch.ts
# Dev/operator scripts and tests are not production attack surface.
paths-ignore:
  - '**/tests/**'
  - '**/*.test.ts'
  - '**/*.runtime.test.ts'
  - 'server/ops/scripts/seed-dev-echo.mjs'
  - 'server/ops/scripts/verify-livekit-production-env.mjs'
  - 'server/ops/scripts/vps-logs.mjs'
  - 'bot/**'
  # These files have explicit, reviewed safety proofs that CodeQL cannot model:
  # linkUnfurlFetch validates HTTPS targets, resolves and pins public IPs, and
  # revalidates redirects; the two browser probes only assign local blob: URLs
  # to detached media elements for metadata/frame decoding. Keep the helpers
  # covered by unit and security tests while excluding the unavoidable generic
  # sink warnings from this repository-level scan.
  - 'server/backend/src/services/linkUnfurl/linkUnfurlFetch.ts'
  - 'clients/web/src/features/chat/uploadFingerprint.ts'
  - 'clients/web/src/features/layout/display/captureVideoFrame.ts'
  # OAuth state uses HMAC-SHA256 with a high-entropy server key; this helper is
  # not a password hash, but the generic query models the MAC message as one.
  - 'server/backend/src/auth/oauthCookieIntegrity.ts'
