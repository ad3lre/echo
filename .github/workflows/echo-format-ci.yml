name: Echo format check

on:
  push:
    branches:
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: OSS tracked-file guard
        run: node scripts/check-oss-artifacts.mjs

      - name: God-file ratchet
        run: node scripts/check-god-file-ratchet.mjs
