name: Echo format check

on:
  push:
    branches:
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Prettier
        run: bun run format:check

      - name: OSS tracked-file guard
        run: bun server/ops/scripts/check-oss-artifacts.mjs

      - name: God-file ratchet
        run: bun server/ops/scripts/check-god-file-ratchet.mjs

      - name: Apple maintainability gate
        run: bun run apple:maintainability

      - name: Apple maintainability unit tests
        run: bun run apple:maintainability:test

      - name: New-code charter (June 2026+)
        run: bun server/ops/scripts/check-new-code-charter.mjs

      - name: New-code charter unit tests
        run: bun run charter:new-code:test

      - name: GitHub mirror policy guard
        run: bun server/ops/scripts/check-github-remote-policy.mjs
