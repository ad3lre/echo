name: Echo format check

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: OSS tracked-file guard
        run: node scripts/check-oss-artifacts.mjs
