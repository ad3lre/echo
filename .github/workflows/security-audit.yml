name: security-audit

on:
  pull_request:
  push:
    branches: ['release/**']
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile
      - run: bun run check:dep-audit
