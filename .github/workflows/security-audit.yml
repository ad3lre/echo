name: security-audit

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
