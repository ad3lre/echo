name: security-audit

on:
  pull_request:
  push:
    branches: ['release/**']
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      # Same gate as `npm run check:dep-audit` (allowlist-aware); omit dev to match runtime risk.
      - run: ECHO_AUDIT_OMIT_DEV=1 npm run check:dep-audit
