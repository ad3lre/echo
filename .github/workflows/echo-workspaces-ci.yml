name: Echo auxiliary workspace checks

on:
  push:
    paths:
      - 'marketing/**'
      - 'bot/**'
      - 'server/activities/**'
      - 'server/voice/**'
      - 'server/media/**'
      - 'clients/web/src/features/paper/**'
      - 'server/backend/crypto/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/echo-workspaces-ci.yml'
  pull_request:
    paths:
      - 'marketing/**'
      - 'bot/**'
      - 'server/activities/**'
      - 'server/voice/**'
      - 'server/media/**'
      - 'clients/web/src/features/paper/**'
      - 'server/backend/crypto/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  auxiliary-workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build marketing
        run: npm run build -w marketing

      - name: Build Discord bot
        run: npm run build -w bot

      - name: Build media
        run: npm run build -w media

      - name: Test media
        run: npm run test -w media

      - name: Build voice
        run: npm run build -w voice

      - name: Test voice
        run: npm run test -w voice

      - name: Build activities
        run: npm run build -w activities

      - name: Test activities
        run: npm run test -w activities

      - name: Typecheck crypto
        run: npm run typecheck -w crypto

      - name: Test crypto
        run: npm run test -w crypto

      - name: Test paper
        run: npm run test -w paper
