name: Echo auxiliary workspace checks

on:
  push:
    paths:
      - 'marketing/**'
      - 'bot/**'
      - 'server/activities/**'
      - 'server/voice/**'
      - 'server/media/**'
      - 'clients/web/src/features/paper/**'
      - 'server/backend/crypto/**'
      - 'contracts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/echo-workspaces-ci.yml'
  pull_request:
    paths:
      - 'marketing/**'
      - 'bot/**'
      - 'server/activities/**'
      - 'server/voice/**'
      - 'server/media/**'
      - 'clients/web/src/features/paper/**'
      - 'server/backend/crypto/**'
      - 'contracts/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auxiliary-workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build marketing
        run: bun run --filter marketing build

      - name: Build Discord bot
        run: bun run --filter bot build

      - name: Build media
        run: bun run --filter media build

      - name: Test media
        run: bun run --filter media test

      - name: Build voice
        run: bun run --filter voice build

      - name: Test voice
        run: bun run --filter voice test

      - name: Build activities
        run: bun run --filter activities build

      - name: Test activities
        run: bun run --filter activities test

      - name: Typecheck crypto
        run: bun run --cwd server/backend/crypto typecheck

      - name: Test crypto
        run: bun run --filter web test -- --run ../../server/backend/crypto/src

      - name: Test paper
        run: bun run --filter web test -- --run src/features/paper
