name: Echo backend checks

on:
  push:
    paths:
      - 'server/backend/**'
      - 'server/media/src/hls/**'
      - 'contracts/**'
      - 'server/ops/scripts/check-*.mjs'
      - 'server/ops/scripts/god-file-baselines.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/echo-backend-ci.yml'
  pull_request:
    paths:
      - 'server/backend/**'
      - 'server/media/src/hls/**'
      - 'contracts/**'
      - 'server/ops/scripts/check-*.mjs'
      - 'server/ops/scripts/god-file-baselines.json'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  echo-ci:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: jwt-0123456789abcdef0123456789abcdef01234567
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo_dev
          POSTGRES_DB: echo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck backend
        run: bun run --filter backend build

      - name: Lint backend
        run: bun run --filter backend lint

      - name: Contract surface + CI guards
        env:
          PG_TEST_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          ECHO_BACKEND_STORAGE: postgres
        run: |
          bun run --filter backend test:storage-mode
          bun run --filter backend test:production-config-gates
          bun run --filter backend test:video-hls-worker-config
          bun run --filter media test:video-hls-notify
          bun run --filter backend test:linkUnfurlStubs
          bun run --filter backend test:linkUnfurlExtract
          bun run --filter backend test:shipping-security
          bun run --filter backend test:security
          bun run --filter backend test:echo:contract
          bun run check:echo-channels
          bun run check:echo-snowflake
          bun run check:echo-single-reality
          bun run check:echo-rbac
          bun run check:channel-message-writes
          bun server/ops/scripts/check-echo-no-sql-in-routes.mjs
          bun server/ops/scripts/check-god-file-ratchet.mjs
          bun server/ops/scripts/check-new-code-charter.mjs
          bun run charter:new-code:test
          bun server/ops/scripts/check-github-remote-policy.mjs
          bun run check:sql-schema-columns
          bun run check:sql-schema-columns:live
          bun server/backend/src/tests/paper/paperCollabState.test.ts
          bun server/backend/src/tests/paper/paperAttribution.test.ts

      - name: Socket handler unit tests
        run: bun run --filter web test -- ../../server/backend/src/tests/channels/channelHandlers.joinChannel.test.ts

      - name: Pipeline integration (Postgres)
        env:
          ECHO_BACKEND_STORAGE: postgres
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          USE_MOCK_DB: 'false'
          ECHO_GUEST_ACCOUNTS_ENABLED: '1'
          ECHO_CONFIG_TEST_ISOLATION: '1'
        run: bun run --filter backend test:echo:pipeline
        timeout-minutes: 3
      - name: Multi-node integration (Postgres + NATS)
        env:
          ECHO_BACKEND_STORAGE: postgres
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          NATS_URL: nats://127.0.0.1:4222
          USE_MOCK_DB: 'false'
          ECHO_CONFIG_TEST_ISOLATION: '1'
        run: bun run --filter backend test:echo:multinode
      - name: Upload presign smoke (Postgres)
        env:
          ECHO_BACKEND_STORAGE: postgres
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          USE_MOCK_DB: 'false'
          ECHO_CONFIG_TEST_ISOLATION: '1'
        run: bun run --filter backend test:echo:uploads
      - name: RBAC integration + goldens (Postgres)
        env:
          ECHO_BACKEND_STORAGE: postgres
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          USE_MOCK_DB: 'false'
          ECHO_CONFIG_TEST_ISOLATION: '1'
        run: bun run --filter backend test:echo:rbac
      - name: Auth integration (Postgres)
        env:
          ECHO_BACKEND_STORAGE: postgres
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          USE_MOCK_DB: 'false'
          JWT_SECRET: jwt-0123456789abcdef0123456789abcdef01234567
          ECHO_CONFIG_TEST_ISOLATION: '1'
        run: bun run --filter backend test:auth
      - name: RBAC sparse bench
        env:
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
        run: bun server/backend/src/tests/permissions/echo.rbac.sparse.bench.ts

  perf-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: jwt-0123456789abcdef0123456789abcdef01234567
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo_dev
          POSTGRES_DB: echo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build backend
        run: bun run --filter backend build

      - name: Permission cache smoke test
        run: bun server/backend/src/tests/permissions/echo.permission.cache.test.ts

      - name: Discord import smoke test
        env:
          ECHO_BACKEND_STORAGE: postgres
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          USE_MOCK_DB: 'false'
          PG_TEST_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
        run: bun server/backend/src/tests/discord/echo.discordImport.test.ts

      - name: Start backend for benchmark
        env:
          PORT: '3000'
          HOST: 127.0.0.1
          ECHO_BACKEND_STORAGE: postgres
          DATABASE_URL: postgresql://echo:echo_dev@127.0.0.1:5432/echo
          USE_MOCK_DB: 'false'
        run: |
          bun server/backend/dist/server/backend/src/index.js > /tmp/echo-backend.log 2>&1 &
          echo $! > /tmp/echo-backend.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/echo-backend.log
          exit 1

      - name: Benchmark health endpoint
        run: bunx autocannon -c 20 -d 20 http://127.0.0.1:3000/api/v1/health

      - name: Stop benchmark backend
        if: always()
        run: |
          if [ -f /tmp/echo-backend.pid ]; then
            kill "$(cat /tmp/echo-backend.pid)" || true
          fi
