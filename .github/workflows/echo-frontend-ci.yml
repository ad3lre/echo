name: Echo frontend checks

on:
  push:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/god-file-baselines.json'
      - 'scripts/check-god-file-ratchet.mjs'
      - 'scripts/check-new-code-charter.mjs'
      - 'scripts/check-new-code-charter.test.mjs'
      - 'scripts/new-code-charter-*.json'
      - '.github/workflows/echo-frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/god-file-baselines.json'
      - 'scripts/check-god-file-ratchet.mjs'
      - 'scripts/check-new-code-charter.mjs'
      - 'scripts/check-new-code-charter.test.mjs'
      - 'scripts/new-code-charter-*.json'
  workflow_dispatch:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint (theme + TS + Vue essential)
        run: npm run lint -w frontend

      - name: i18n key parity
        run: npm run i18n:check -w frontend

      - name: God-file ratchet
        run: node scripts/check-god-file-ratchet.mjs

      - name: New-code charter (June 2026+)
        run: node scripts/check-new-code-charter.mjs

      - name: New-code charter unit tests
        run: npm run charter:new-code:test

      - name: Strict theme ESLint
        run: npm run lint:theme -w frontend

      - name: Stylelint (SCSS + Vue SFC styles)
        run: npm run lint:style -w frontend

      - name: Typecheck + build
        run: npm run build -w frontend

      - name: Assert no source maps in dist
        run: |
          if compgen -G "frontend/dist/**/*.map" > /dev/null; then
            echo "ERROR: source map files found under frontend/dist/"
            find frontend/dist -name '*.map' -print
            exit 1
          fi

      - name: Unit tests
        run: npm run test -w frontend
