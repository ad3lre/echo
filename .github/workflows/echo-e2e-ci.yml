name: Echo E2E smoke

on:
  pull_request:
    paths:
      - 'clients/web/**'
      - 'clients/web/src/features/paper/**'
      - 'server/backend/crypto/**'
      - 'server/backend/**'
      - 'contracts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/echo-e2e-ci.yml'
  push:
    branches:
      - 'release/**'
    paths:
      - 'clients/web/**'
      - 'clients/web/src/features/paper/**'
      - 'server/backend/crypto/**'
      - 'server/backend/**'
      - 'contracts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/echo-e2e-ci.yml'
  workflow_dispatch:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Cypress smoke (memory stack)
        run: bun run test:e2e
