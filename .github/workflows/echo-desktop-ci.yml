name: Echo desktop (Tauri)

on:
  push:
    branches:
      - '**'
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/tauri-build.mjs'
      - 'scripts/tauri-before-build-frontend.mjs'
      - '.github/workflows/echo-desktop-ci.yml'
      - '.github/workflows/echo-desktop-release-windows.yml'

  pull_request:
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/tauri-build.mjs'
      - 'scripts/tauri-before-build-frontend.mjs'
      - '.github/workflows/echo-desktop-ci.yml'
      - '.github/workflows/echo-desktop-release-windows.yml'
  workflow_dispatch:

concurrency:
  group: echo-desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same `https://chat-echo.com` origins as echo-android-ci.yml; inlined at bundle build time (compile does not call the API).
  VITE_API_URL: https://chat-echo.com
  VITE_SOCKET_IO_URL: https://chat-echo.com
  # Release-only (optional repository secrets): TAURI_SIGNING_PRIVATE_KEY,
  # ECHO_TAURI_UPDATER_ENDPOINTS, ECHO_TAURI_CREATE_UPDATER_ARTIFACTS=1 — see docs/operations/desktop-windows.md

jobs:
  tauri-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Full bundle: NSIS + MSI are Windows-specific; validate installers here.
            tauri_build_cmd: npm run tauri:build
          - os: ubuntu-latest
            # Faster: compile + link check without deb/AppImage bundling (saves minutes).
            tauri_build_cmd: npm run tauri:build:quick
          - os: macos-latest
            tauri_build_cmd: npm run tauri:build:quick
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'

      - name: Install Linux WebKitGTK dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Keep aligned with `rust-version` in `src-tauri/Cargo.toml`.
          toolchain: '1.80'

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root dependencies
        run: npm ci

      - name: Tauri build
        run: ${{ matrix.tauri_build_cmd }}

      - name: Upload Windows installers (NSIS + MSI)
        if: success() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: echo-desktop-windows-${{ github.run_id }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
