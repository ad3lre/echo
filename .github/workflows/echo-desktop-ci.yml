name: Echo desktop (Tauri)

on:
  push:
    branches:
      - '**'
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/tauri-build.mjs'
      - 'scripts/tauri-before-build-frontend.mjs'
      - '.github/workflows/echo-desktop-ci.yml'
      - '.github/workflows/echo-desktop-release-windows.yml'

  pull_request:
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/tauri-build.mjs'
      - 'scripts/tauri-before-build-frontend.mjs'
      - '.github/workflows/echo-desktop-ci.yml'
      - '.github/workflows/echo-desktop-release-windows.yml'
  workflow_dispatch:

concurrency:
  group: echo-desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same `https://chat-echo.com` origins as echo-android-ci.yml; inlined at bundle build time (compile does not call the API).
  VITE_API_URL: https://chat-echo.com
  VITE_SOCKET_IO_URL: https://chat-echo.com
  # Release-only (optional repository secrets): TAURI_SIGNING_PRIVATE_KEY,
  # ECHO_TAURI_UPDATER_ENDPOINTS, ECHO_TAURI_CREATE_UPDATER_ARTIFACTS=1 — see docs/operations/desktop-windows.md

jobs:
  tauri-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Full bundle: NSIS + MSI are Windows-specific; validate installers here.
            tauri_build_cmd: npm run tauri:build
            node_options: --max-old-space-size=6144
          - os: ubuntu-22.04
            # Faster: compile + link check without deb/AppImage bundling (saves minutes).
            tauri_build_cmd: npm run tauri:build:quick
            # Linux runners: frontend Vite + Rust link in one job — avoid OOM vs 6GiB Node heap.
            node_options: --max-old-space-size=4096
          - os: macos-latest
            tauri_build_cmd: npm run tauri:build:quick
            node_options: --max-old-space-size=6144
    runs-on: ${{ matrix.os }}
    env:
      # Match root `npm run build` heap budget; Tauri’s `beforeBuildCommand` runs `npm run build -w frontend` without that wrapper.
      NODE_OPTIONS: ${{ matrix.node_options }}
      # Avoid incremental + cross-matrix rust-cache restoring another OS’s target dir.
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install Linux WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libdbus-1-dev \
            libasound2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Matrix jobs share the same job id/name; pin cache to OS so Linux targets are not restored on macOS/Windows.
          key: ${{ matrix.os }}

      - name: Install root dependencies
        run: npm ci

      - name: Tauri build
        run: ${{ matrix.tauri_build_cmd }}

      - name: Upload Windows installers (NSIS + MSI)
        if: success() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: echo-desktop-windows-${{ github.run_id }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
