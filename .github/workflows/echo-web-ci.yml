name: Echo web checks

on:
  push:
    paths:
      - 'clients/web/**'
      - 'clients/web/src/features/paper/**'
      - 'server/backend/crypto/**'
      - 'server/activities/cores/**'
      - 'contracts/**'
      - 'package.json'
      - 'bun.lock'
      - 'server/ops/scripts/god-file-baselines.json'
      - 'server/ops/scripts/check-god-file-ratchet.mjs'
      - 'server/ops/scripts/check-new-code-charter.mjs'
      - 'server/ops/scripts/check-new-code-charter.test.mjs'
      - 'server/ops/scripts/check-doc-links.mjs'
      - 'docs/**'
      - 'server/ops/scripts/new-code-charter-*.json'
      - '.github/workflows/echo-web-ci.yml'
  pull_request:
    paths:
      - 'clients/web/**'
      - 'clients/web/src/features/paper/**'
      - 'server/backend/crypto/**'
      - 'server/activities/cores/**'
      - 'contracts/**'
      - 'package.json'
      - 'bun.lock'
      - 'server/ops/scripts/god-file-baselines.json'
      - 'server/ops/scripts/check-god-file-ratchet.mjs'
      - 'server/ops/scripts/check-new-code-charter.mjs'
      - 'server/ops/scripts/check-new-code-charter.test.mjs'
      - 'server/ops/scripts/check-doc-links.mjs'
      - 'docs/**'
      - 'server/ops/scripts/new-code-charter-*.json'
  workflow_dispatch:

jobs:
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (theme + TS + Vue essential)
        run: bun run --filter web lint

      - name: i18n key parity
        run: bun run --filter web i18n:check

      - name: God-file ratchet
        run: bun server/ops/scripts/check-god-file-ratchet.mjs

      - name: New-code charter (June 2026+)
        run: bun server/ops/scripts/check-new-code-charter.mjs

      - name: New-code charter unit tests
        run: bun run charter:new-code:test

      - name: Documentation links
        run: bun run docs:links:check

      - name: Strict theme ESLint
        run: bun run --filter web lint:theme

      - name: Stylelint (SCSS + Vue SFC styles)
        run: bun run --filter web lint:style

      - name: Typecheck + build
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: bun run --filter web build

      - name: Assert no source maps in dist
        run: |
          if [ -n "$(find clients/web/dist -type f -name '*.map' -print -quit)" ]; then
            echo "ERROR: source map files found under clients/web/dist/"
            find clients/web/dist -name '*.map' -print
            exit 1
          fi

      - name: Unit tests
        run: bun run --filter web test:coverage -- --reporter=dot
