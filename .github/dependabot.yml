version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Single lockfile at repo root covers all npm workspaces
  # (clients/web, server/backend, contracts, bot, marketing, server/ops/scripts,
  # server/voice, server/media, server/activities).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
