version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Root package.json + bun.lock cover all Bun workspaces
  # (clients/web, server/backend, contracts, bot, marketing, server/ops/scripts,
  # server/voice, server/media, server/activities). Dependabot still uses the
  # npm ecosystem metadata against package.json; installs locally via Bun.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
