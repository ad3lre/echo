# Example LiveKit server config for production-style deployment.
# Copy and adapt in your deploy pipeline. LiveKit does NOT interpolate ${VAR} in YAML;
# substitute real hostnames, ports, and secrets from a secrets manager or templating step.
#
# See: docs/operations/livekit-production.md
# Dev reference: infra/livekit/livekit.yaml

# Signaling port — often behind TLS termination (e.g. 443) or direct 7880 with TLS.
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 57000
  port_range_end: 60000
  # Production: set true and provide node_ip or use STUN/external IP discovery appropriate to your cloud.
  use_external_ip: true
  # node_ip: 203.0.113.10   # example: public IPv4 of this SFU if fixed
  congestion_control:
    enabled: true

  # TLS TURN example (replace host, credentials, cert paths with your coturn or provider).
  # turn_servers:
  #   - host: turn.example.com
  #     port: 5349
  #     protocol: tls
  #     username: "${RENDERED_FROM_SECRETS}"
  #     credential: "${RENDERED_FROM_SECRETS}"

room:
  # Seconds: keep room open with no joiners / after last participant leaves.
  empty_timeout: 300
  departure_timeout: 30
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/vp9
    - mime: video/h264
    - mime: video/av1

keys:
  # Must match Echo API LIVEKIT_API_KEY / LIVEKIT_API_SECRET (same string values).
  your_api_key_id: your_api_secret_value_min_32_chars

# Webhook: must be HTTPS and reachable from wherever this LiveKit process runs.
webhook:
  urls:
    - https://your-echo-api.example.com/api/v1/hooks/livekit
  api_key: your_api_key_id

logging:
  level: info
