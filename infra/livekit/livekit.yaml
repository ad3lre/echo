# LiveKit SFU — local Docker Compose dev (single node). YAML values are literal (no ${VAR}).
# LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env must match the `keys` block (see .env.example).
# Production: use infra/livekit/livekit.production.example.yaml and docs/operations/livekit-production.md.
#
# Webhook reaches the Echo API on the host from the LiveKit container via host.docker.internal
# (docker-compose.yml adds extra_hosts on Linux; Docker Desktop provides the name by default).
#
# LAN / other devices on your network: `npm run lan:sync` writes infra/livekit/livekit.runtime.yaml (gitignored).

port: 7880

rtc:
  port_range_start: 57000
  port_range_end: 57100
  tcp_port: 7881
  turn_servers:
    - host: coturn
      port: 3478
      protocol: udp
      username: echo
      credential: echo_turn_dev_secret
  use_external_ip: false
  node_ip: 127.0.0.1
  enable_loopback_candidate: true
  congestion_control:
    enabled: true

room:
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/vp9
    - mime: video/h264
    - mime: video/av1

keys:
  devkey: devsecretdevsecretdevsecret1234

webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/api/v1/hooks/livekit

logging:
  level: info
